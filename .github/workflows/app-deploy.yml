name: Build and deploy app

# Демо на Pages выкатывается отдельным workflow и этим не затрагивается.
#
# Ветка master → staging автоматически. Прод — только вручную, чтобы выкатка
# на людей всегда была осознанным действием.
on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/app-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Куда выкатываем
        type: choice
        options: [staging, production]
        default: staging
      image:
        description: "Готовый тег для отката (пусто — собрать новый)"
        type: string
        default: ""

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    # При откате ничего не собираем — просто берём существующий тег.
    if: ${{ github.event.inputs.image == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build]
    if: ${{ always() && (needs.build.result == 'success' || github.event.inputs.image != '') }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Выкатка по SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # deploy.sh сам делает бэкап, миграции, health-чек и откат при провале
          script: |
            set -e
            IMAGE="${{ github.event.inputs.image || format('{0}:{1}', env.IMAGE, needs.build.outputs.tag) }}"
            cd /opt/bereg
            ./deploy.sh "$IMAGE"
