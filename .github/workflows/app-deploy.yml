name: Build and deploy app

# Демо на Pages выкатывается отдельным workflow и этим не затрагивается.
#
# Пока сервера нет, автозапуск отключён: на каждый пуш он собирал образ и падал
# на SSH-шаге, вешая красный крест на каждый коммит и съедая минуты CI.
# Когда сервер появится и секреты SSH_* будут заданы — вернуть блок push:
#   push:
#     branches: [master]
#     paths: ["frontend/**", "deploy/**", ".github/workflows/app-deploy.yml"]
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Куда выкатываем
        type: choice
        options: [staging, production]
        default: staging
      image:
        description: "Готовый тег для отката (пусто — собрать новый)"
        type: string
        default: ""

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Docker-тег обязан быть в нижнем регистре (репозиторий — Begemot-m/bereg).
  IMAGE: ghcr.io/begemot-m/bereg

jobs:
  # Те же ворота, что у демо: на боевой сервер тем более не должно уезжать
  # то, что не проходит типы, тесты и проверку миграций.
  check:
    if: ${{ github.event.inputs.image == '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx prisma generate
      - run: bunx tsc --noEmit
      - run: bun test
      - run: node scripts/check-migrations.mjs

  build:
    # При откате ничего не собираем — просто берём существующий тег.
    needs: check
    if: ${{ github.event.inputs.image == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build]
    if: ${{ always() && (needs.build.result == 'success' || github.event.inputs.image != '') }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Выкатка по SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # deploy.sh сам делает бэкап, миграции, health-чек и откат при провале
          script: |
            set -e
            IMAGE="${{ github.event.inputs.image || format('{0}:{1}', env.IMAGE, needs.build.outputs.tag) }}"
            cd /opt/bereg
            ./deploy.sh "$IMAGE"
