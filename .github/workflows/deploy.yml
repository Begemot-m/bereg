name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Нужно, чтобы гасить зависшие в очереди деплойменты перед своим.
  deployments: write

# Начатую выкатку не рвём: отменённый на середине deploy-pages оставляет
# деплоймент висеть в очереди, и следующий пуш ждёт его до таймаута — именно
# так демо переставало обновляться на несколько коммитов подряд.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Ворота: сломанный код не должен доезжать до людей. Типы, тесты и страж
  # миграций — быстрые проверки, они дешевле одного отката.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx prisma generate
      - name: Типы
        run: bunx tsc --noEmit
      - name: Тесты
        run: bun test
      - name: Миграции без разрушающих изменений
        run: node scripts/check-migrations.mjs

  build:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # В статическом демо серверный API не нужен — убираем, чтобы export не падал.
      - run: rm -rf src/app/api
      - name: Build static demo
        env:
          NEXT_PUBLIC_DEMO: "1"
          STATIC_EXPORT: "1"
          PAGES_BASE_PATH: bereg
        # Метка сборки: видна в кабинете и лежит в version.json рядом со сборкой.
        # По ней приложение само замечает, что вебвью держит старую версию.
        run: |
          export NEXT_PUBLIC_BUILD="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bunx next build
          printf '{"build":"%s","sha":"%s"}' "$NEXT_PUBLIC_BUILD" "$GITHUB_SHA" > out/version.json
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # contents: write — чтобы двигать тег `demo-live` (см. последний шаг).
    permissions:
      contents: write
      pages: write
      id-token: write
      deployments: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Чужой деплоймент, застрявший в очереди, держит окно Pages: наш
      # deploy-pages молча ждёт его до таймаута и падает, а демо остаётся
      # на старой сборке. Помечаем такие хвосты неактивными и идём дальше.
      - name: Погасить зависшие деплойменты Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=30" --jq '.[].id')
          for id in $ids; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // "unknown"')
            case "$state" in
              in_progress|queued|pending|waiting)
                echo "гасим зависший деплоймент $id ($state)"
                gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=inactive >/dev/null || true
                ;;
            esac
          done

      # 600000 мс — потолок самого действия, больше оно молча обрезает.
      # Если очередь Pages не ответила за это время, пробуем ещё раз.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 600000
          error_count: 20
      - name: Повторная выкатка, если очередь Pages не ответила
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 20

      # Отметка «вот это сейчас в демо». Тег читается обычным `git ls-remote`,
      # то есть через github.com — единственный узел GitHub, доступный из
      # сетей, где api.github.com и *.github.io закрыты. Локальный
      # `bun run deploy:demo` по этому тегу понимает, доехала ли выкатка, и
      # больше не зависит от API.
      - uses: actions/checkout@v4
      - name: Пометить выкаченный коммит тегом demo-live
        run: |
          git tag -f demo-live "$GITHUB_SHA"
          git push -f origin refs/tags/demo-live
