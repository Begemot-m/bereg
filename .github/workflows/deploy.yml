name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Начатую выкатку не рвём: отменённый на середине deploy-pages оставляет
# деплоймент висеть в очереди, и следующий пуш ждёт его до таймаута — именно
# так демо переставало обновляться на несколько коммитов подряд.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Ворота: сломанный код не должен доезжать до людей. Типы, тесты и страж
  # миграций — быстрые проверки, они дешевле одного отката.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx prisma generate
      - name: Типы
        run: bunx tsc --noEmit
      - name: Тесты
        run: bun test
      - name: Миграции без разрушающих изменений
        run: node scripts/check-migrations.mjs

  build:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # В статическом демо серверный API не нужен — убираем, чтобы export не падал.
      - run: rm -rf src/app/api
      - name: Build static demo
        env:
          NEXT_PUBLIC_DEMO: "1"
          STATIC_EXPORT: "1"
          PAGES_BASE_PATH: bereg
        # Метка сборки: видна в кабинете и лежит в version.json рядом со сборкой.
        # По ней приложение само замечает, что вебвью держит старую версию.
        run: |
          export NEXT_PUBLIC_BUILD="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bunx next build
          printf '{"build":"%s"}' "$NEXT_PUBLIC_BUILD" > out/version.json
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # 600000 мс — потолок самого действия, больше оно молча обрезает.
      # Если очередь Pages не ответила за это время, пробуем ещё раз.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 600000
          error_count: 20
      - name: Повторная выкатка, если очередь Pages не ответила
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 20
